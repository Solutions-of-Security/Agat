# Run the scraper in the same network namespace as this loopback-only runtime.
# A container's 127.0.0.1 is not the Mac host. Do not publish the decision port remotely.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: agat-decision
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8766"]

# No Alertmanager or notification receiver is configured by this example.
