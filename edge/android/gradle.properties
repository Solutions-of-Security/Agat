org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Production builds must point this at the signed llama.cpp b10686 / commit 3173a56 source tree.
# Example: agatLlamaCppDir=/absolute/path/to/llama.cpp
agatLlamaCppDir=
agatEnableVulkan=true
# Required by current llama.cpp Vulkan builds unless supplied by VULKAN_SDK/CMake prefix.
# Example: agatSpirvHeadersDir=/absolute/prefix/share/cmake/SPIRV-Headers
agatSpirvHeadersDir=
agatCloudProjectNumber=0
