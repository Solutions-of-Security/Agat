version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories: [/workers, /sandbox]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs/agent-process-priority-report
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
