name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install --requirement workers/requirements.txt
      - run: npm run typecheck
      - name: Unit and Temporal history replay tests
        run: npm test
      - run: npm run build
      - name: Validate deployment inputs
        env:
          AGAT_ADMIN_TOKEN: ci-admin-token
          AGAT_ENROLLMENT_TOKEN: ci-enrollment-token
          AGAT_CREDENTIALS_KEY: ci-credentials-key-not-for-production
        run: |
          docker compose config --quiet
          for script in scripts/*.sh; do
            bash -n "$script"
          done
