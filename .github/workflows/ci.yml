name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence replay checks source SHA against the original measurement commits.
          fetch-depth: 0
      - uses: ./.github/actions/docker-cache
        with:
          image: busybox:1.36
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install --requirement workers/requirements.txt
      - run: npm run typecheck
      - name: Documentation links, catalog and checker tests
        run: npm run docs:check
      - name: Owned Docker cleanup and disposable storage
        env:
          AGAT_TEST_DOCKER_CLEANUP: "1"
        run: |
          docker pull busybox:1.36
          python -m unittest discover -s scripts/test -p 'test_temporal_*cleanup.py'
      - name: Unit and Temporal history replay tests
        run: npm test
      - run: npm run build
      - name: Production image and office export runtime
        run: |
          docker build --tag agat-coordinator-ci .
          docker run --rm -i --entrypoint node agat-coordinator-ci --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { renderBusinessReportOffice } from './apps/coordinator/dist/business-report-office.js';
          const markdown = '# Внутренний отчёт\n\n## Краткий результат\n\nТехнический пример: 100 → 120; 120 − 100 = 20.\n';
          const input = { markdown, canonicalSha256: createHash('sha256').update(markdown).digest('hex'), canonicalArtifactId: '11111111-1111-4111-8111-111111111111', origin: 'https://agat.example', createdAt: '2026-10-25T00:00:00.000Z' };
          const docx = await renderBusinessReportOffice({ ...input, format: 'docx' });
          const pdf = await renderBusinessReportOffice({ ...input, format: 'pdf' });
          assert.equal(docx.bytes.subarray(0, 2).toString(), 'PK');
          assert.equal(pdf.bytes.subarray(0, 5).toString(), '%PDF-');
          assert.equal(docx.documentSha256, pdf.documentSha256);
          console.log('Production Node runtime: DOCX/PDF, pinned fonts and license loaded');
          JS
      - name: Validate deployment inputs
        env:
          AGAT_ADMIN_TOKEN: ci-admin-token
          AGAT_ENROLLMENT_TOKEN: ci-enrollment-token
          AGAT_CREDENTIALS_KEY: ci-credentials-key-not-for-production
        run: |
          docker compose config --quiet
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace @agat/coordinator && npm run build --workspace @agat/web
      - name: Clean SQLite startup and first run on desktop and mobile
        run: npm run test:browser
      - name: Report pack install, update, rollback and document report on desktop and mobile
        env:
          AGAT_PACK_UI_SCREENSHOTS: ${{ runner.temp }}/agat-pack-ui-evidence
        run: npm run test:process-pack:ui
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-smoke
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/agat-pack-ui-evidence/
          retention-days: 7

  integration:
    name: integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [ha-postgres, state-migration, artifact-store, region-loss-dr, temporal-rag, temporal-postgres-rag]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-cache
        with:
          image: ${{ matrix.suite == 'temporal-rag' && 'temporalio/temporal:1.8.1' || 'postgres:17.6-alpine' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        if: startsWith(matrix.suite, 'temporal-')
        with:
          python-version: "3.13"
      - name: Run against disposable integration services
        run: npm run fleet:test-${{ matrix.suite }}
      - name: Docker registry diagnostics after integration failure
        if: ${{ failure() }}
        run: |
          curl --silent --show-error --head --max-time 15 \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            https://mirror.gcr.io/v2/library/postgres/manifests/17.6-alpine
          sudo journalctl --no-pager -u docker.service -n 60

  required:
    if: ${{ always() }}
    needs: [test, browser, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$INTEGRATION_RESULT" = success
