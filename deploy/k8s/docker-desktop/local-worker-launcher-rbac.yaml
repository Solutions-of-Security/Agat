apiVersion: v1
kind: ServiceAccount
metadata:
  name: agat-coordinator
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: coordinator
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agat-local-worker-launcher
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: coordinator
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - create
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agat-local-worker-launcher
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: coordinator
subjects:
  - kind: ServiceAccount
    name: agat-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agat-local-worker-launcher
