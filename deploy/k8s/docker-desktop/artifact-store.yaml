apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agat-artifact-store
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: artifact-store
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agat-artifact-store
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: artifact-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agat
      app.kubernetes.io/component: artifact-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agat
        app.kubernetes.io/component: artifact-store
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: agat-secrets
                  key: artifact-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agat-secrets
                  key: artifact-secret-key
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agat-artifact-store
---
apiVersion: v1
kind: Service
metadata:
  name: agat-artifact-store
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: artifact-store
spec:
  selector:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: artifact-store
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agat-artifact-store-bootstrap-v24
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: artifact-store-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agat
        app.kubernetes.io/component: artifact-store-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: agat-local/coordinator:1.7.0
          imagePullPolicy: Always
          command: ["node", "apps/coordinator/dist/artifact-store-bootstrap.js", "apply"]
          envFrom:
            - configMapRef:
                name: agat-coordinator-config
          env:
            - name: AGAT_ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agat-secrets
                  key: artifact-access-key
            - name: AGAT_ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agat-secrets
                  key: artifact-secret-key
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
