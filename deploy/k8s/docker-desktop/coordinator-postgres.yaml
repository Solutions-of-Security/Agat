apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agat-coordinator-postgres
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: state-store
    app.kubernetes.io/part-of: agat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agat-coordinator-postgres
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: state-store
    app.kubernetes.io/part-of: agat
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agat
      app.kubernetes.io/component: state-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agat
        app.kubernetes.io/component: state-store
        app.kubernetes.io/part-of: agat
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-permissions
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec", "chown 70:70 /var/lib/postgresql/data && chmod 0700 /var/lib/postgresql/data"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: agat
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agat-postgres-secrets
                  key: admin-password
            - name: AGAT_POSTGRES_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agat-postgres-secrets
                  key: system-password
            - name: AGAT_POSTGRES_TENANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agat-postgres-secrets
                  key: tenant-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U postgres -d agat"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U postgres -d agat"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U postgres -d agat"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/10-agat-roles.sh
              subPath: init-agat.sh
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agat-coordinator-postgres
        - name: init
          configMap:
            name: agat-postgres-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: agat-coordinator-postgres
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: state-store
    app.kubernetes.io/part-of: agat
spec:
  selector:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: state-store
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agat-coordinator-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agat
      app.kubernetes.io/component: state-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agat
              app.kubernetes.io/component: coordinator
      ports:
        - protocol: TCP
          port: 5432
