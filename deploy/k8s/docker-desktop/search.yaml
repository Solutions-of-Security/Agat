apiVersion: v1
kind: ConfigMap
metadata:
  name: agat-search-config
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: agat
data:
  settings.yml: |
    use_default_settings:
      engines:
        remove:
          - ahmia
          - torch
          - wikidata

    general:
      debug: false
      instance_name: "AGAT Search"
      donation_url: false
      contact_url: false

    search:
      safe_search: 1
      formats:
        - html
        - json

    server:
      # The container overrides this value with SEARXNG_SECRET from agat-secrets.
      secret_key: "overridden-by-kubernetes-secret"
      limiter: false
      image_proxy: false

    outgoing:
      request_timeout: 8.0
  limiter.toml: |
    # The instance is ClusterIP-only and server.limiter is disabled. Keeping a
    # valid local file prevents SearXNG from warning about a missing config.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agat-search
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: agat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: agat
      app.kubernetes.io/component: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agat
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: agat
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-cache
          image: docker.io/searxng/searxng:2026.8.12-cdfdaa5a8@sha256:c2dc2d9e6b910653e8628361c23443222490e4cabbb9e02667b7847143db843b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - chown -R 977:977 /var/cache/searxng
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: cache
              mountPath: /var/cache/searxng
      containers:
        - name: search
          image: docker.io/searxng/searxng:2026.8.12-cdfdaa5a8@sha256:c2dc2d9e6b910653e8628361c23443222490e4cabbb9e02667b7847143db843b
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: agat-secrets
                  key: search-secret
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng/settings.yml
            - name: FORCE_OWNERSHIP
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
                - name: X-Real-IP
                  value: 127.0.0.1
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
                - name: X-Real-IP
                  value: 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
                - name: X-Real-IP
                  value: 127.0.0.1
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: config
              mountPath: /etc/searxng/limiter.toml
              subPath: limiter.toml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agat-search-config
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agat-search
  labels:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: agat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agat
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
