apiVersion: v1
kind: ConfigMap
metadata:
  name: agat-coordinator-config
data:
  AGAT_HOST: "0.0.0.0"
  AGAT_PORT: "8787"
  AGAT_DB_PATH: "/data/agat.db"
  AGAT_ARTIFACTS_DIR: "/data/artifacts"
  AGAT_SEED_DEMO: "false"
  AGAT_SERVE_WEB: "true"
  AGAT_ALLOWED_ORIGINS: ""
  AGAT_LEASE_TTL_SECONDS: "180"
  AGAT_LOCAL_WORKER_LAUNCHER: "true"
  AGAT_LOCAL_WORKER_NAMESPACE: "agat"
  AGAT_LOCAL_WORKER_IMAGE: "agat-local/worker:1.3.0"
  AGAT_LOCAL_WORKER_EMBEDDING_MODELS: "embeddinggemma"
  AGAT_LOCAL_WORKER_CONFIG_MAP: "agat-worker-config"
  AGAT_LOCAL_WORKER_SECRET: "agat-secrets"
  AGAT_LOCAL_MODEL_BASE_URL: "http://host.docker.internal:11434/v1"
  AGAT_LOCAL_MODEL_DISCOVERY_URL: "http://host.docker.internal:11434/api/tags"
  AGAT_LOCAL_WORKER_WEB_ENABLED: "true"
  AGAT_LOCAL_WORKER_MAX_PER_LAUNCH: "8"
  AGAT_OIDC_ENABLED: "true"
  AGAT_OIDC_ISSUER: "http://localhost:8080/realms/agat"
  AGAT_OIDC_CLIENT_ID: "agat-web"
  AGAT_OIDC_JWKS_URL: "http://agat-keycloak:8080/realms/agat/protocol/openid-connect/certs"
  AGAT_TEMPORAL_ENABLED: "true"
  AGAT_TEMPORAL_TARGET: "local"
  AGAT_TEMPORAL_TLS: "false"
  AGAT_TEMPORAL_ADDRESS: "agat-temporal:7233"
  AGAT_TEMPORAL_NAMESPACE: "agat"
  AGAT_TEMPORAL_TASK_QUEUE: "agat-processes-v1"
  AGAT_STATE_STORE_DRIVER: "sqlite"
  AGAT_OTEL_ENABLED: "false"
  AGAT_MCP_ENABLED: "true"
  AGAT_MCP_REFRESH_SECONDS: "30"
  AGAT_MCP_REQUEST_TIMEOUT_SECONDS: "60"
  AGAT_MCP_MAX_RESPONSE_BYTES: "4194304"
  AGAT_MCP_APPROVAL_TTL_SECONDS: "600"
  AGAT_A2A_ENABLED: "true"
  AGAT_A2A_PUBLIC_BASE_URL: "http://127.0.0.1:8787"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "agat-coordinator"
  TMPDIR: "/tmp"
