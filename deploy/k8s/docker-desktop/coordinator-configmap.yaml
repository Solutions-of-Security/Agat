apiVersion: v1
kind: ConfigMap
metadata:
  name: agat-coordinator-config
data:
  AGAT_HOST: "0.0.0.0"
  AGAT_PORT: "8787"
  AGAT_DB_PATH: "/data/agat.db"
  AGAT_ARTIFACTS_DIR: "/data/artifacts"
  AGAT_ARTIFACT_STORE_DRIVER: "s3"
  AGAT_ARTIFACT_RETENTION_DAYS: "30"
  AGAT_ARTIFACT_LIFECYCLE_INTERVAL_SECONDS: "60"
  AGAT_ARTIFACT_S3_ENDPOINT: "http://agat-artifact-store:9000"
  AGAT_ARTIFACT_S3_REGION: "us-east-1"
  AGAT_ARTIFACT_S3_BUCKET: "agat-artifacts"
  AGAT_ARTIFACT_S3_PREFIX: "agat-local"
  AGAT_ARTIFACT_S3_FORCE_PATH_STYLE: "true"
  AGAT_ARTIFACT_S3_REQUEST_TIMEOUT_MS: "15000"
  AGAT_ARTIFACT_S3_MAX_OBJECT_BYTES: "1048576"
  AGAT_ARTIFACT_S3_SSE: "none"
  AGAT_ARTIFACT_S3_OBJECT_LOCK_MODE: "none"
  AGAT_ARTIFACT_S3_REQUIRE_VERSIONING: "true"
  AGAT_SEED_DEMO: "false"
  AGAT_SERVE_WEB: "true"
  AGAT_ALLOWED_ORIGINS: ""
  AGAT_LEASE_TTL_SECONDS: "180"
  AGAT_LOCAL_WORKER_LAUNCHER: "true"
  AGAT_LOCAL_WORKER_NAMESPACE: "agat"
  AGAT_LOCAL_WORKER_IMAGE: "agat-local/worker:1.7.0"
  AGAT_LOCAL_WORKER_EMBEDDING_MODELS: "embeddinggemma"
  AGAT_LOCAL_WORKER_CONFIG_MAP: "agat-worker-config"
  AGAT_LOCAL_WORKER_SECRET: "agat-secrets"
  AGAT_LOCAL_MODEL_BASE_URL: "http://host.docker.internal:11434/v1"
  AGAT_LOCAL_MODEL_DISCOVERY_URL: "http://host.docker.internal:11434/api/tags"
  AGAT_LOCAL_WORKER_WEB_ENABLED: "true"
  AGAT_LOCAL_WORKER_MAX_PER_LAUNCH: "8"
  AGAT_OIDC_ENABLED: "true"
  AGAT_OIDC_ISSUER: "http://localhost:8080/realms/agat"
  AGAT_OIDC_CLIENT_ID: "agat-web"
  AGAT_OIDC_JWKS_URL: "http://agat-keycloak:8080/realms/agat/protocol/openid-connect/certs"
  AGAT_TEMPORAL_ENABLED: "true"
  AGAT_TEMPORAL_TARGET: "local"
  AGAT_TEMPORAL_TLS: "false"
  AGAT_TEMPORAL_ADDRESS: "agat-temporal:7233"
  AGAT_TEMPORAL_NAMESPACE: "agat"
  AGAT_TEMPORAL_TASK_QUEUE: "agat-processes-v1"
  AGAT_STATE_STORE_DRIVER: "postgresql"
  AGAT_POSTGRES_POOL_MAX: "4"
  AGAT_POSTGRES_CONNECT_TIMEOUT_MS: "5000"
  AGAT_POSTGRES_IDLE_TIMEOUT_MS: "30000"
  AGAT_POSTGRES_STATEMENT_TIMEOUT_MS: "30000"
  AGAT_POSTGRES_SSL_MODE: "disable"
  AGAT_REGION: "local"
  AGAT_RESIDENCY_DOMAIN: "local"
  AGAT_REGION_LOSS_DR_ACTIVATION_ID: ""
  AGAT_REGION_LOSS_DR_WRITE_EPOCH: "1"
  # Локальный bootstrap допускает unsigned worker. Production cells должны задать trust roots и true.
  AGAT_WORKER_RELEASE_PUBLIC_KEYS: "{}"
  AGAT_REQUIRE_SIGNED_WORKER_RELEASES: "false"
  AGAT_WORKER_PROVENANCE_PUBLIC_KEYS: "{}"
  AGAT_REQUIRE_WORKER_PROVENANCE: "false"
  AGAT_WORKER_RUNTIME_ATTESTATION_PUBLIC_KEYS: "{}"
  AGAT_REQUIRE_WORKER_RUNTIME_ATTESTATION: "false"
  AGAT_WORKER_RUNTIME_ATTESTATION_PROVIDERS: "spiffe"
  AGAT_WORKER_RUNTIME_IDENTITY_PREFIXES: "spiffe://agat.local/worker/"
  AGAT_WORKER_RUNTIME_CHALLENGE_TTL_SECONDS: "120"
  AGAT_WORKER_RUNTIME_MAX_LIFETIME_SECONDS: "3600"
  AGAT_SIEM_ENABLED: "false"
  AGAT_SIEM_URL: ""
  AGAT_SIEM_BATCH_SIZE: "100"
  AGAT_SIEM_INTERVAL_SECONDS: "5"
  AGAT_SIEM_TIMEOUT_SECONDS: "10"
  AGAT_SIEM_REQUIRE_ACK: "true"
  AGAT_SIEM_MAX_ATTEMPTS: "8"
  AGAT_SIEM_DELIVERED_RETENTION_DAYS: "30"
  AGAT_SIEM_DLQ_RETENTION_DAYS: "90"
  AGAT_SIEM_RETENTION_INTERVAL_SECONDS: "900"
  AGAT_OTEL_ENABLED: "false"
  AGAT_MCP_ENABLED: "true"
  AGAT_MCP_REFRESH_SECONDS: "30"
  AGAT_MCP_REQUEST_TIMEOUT_SECONDS: "60"
  AGAT_MCP_MAX_RESPONSE_BYTES: "4194304"
  AGAT_MCP_APPROVAL_TTL_SECONDS: "600"
  AGAT_SANDBOX_ENABLED: "true"
  AGAT_SANDBOX_NAMESPACE: "agat"
  AGAT_SANDBOX_WASI_IMAGE: "agat-local/sandbox-wasi:1.7.0"
  AGAT_SANDBOX_RUNTIME_CLASS: ""
  # Docker Desktop's default CNI does not guarantee NetworkPolicy enforcement.
  # WASI remains usable; native container tools stay fail-closed until an enforcing CNI is installed.
  AGAT_SANDBOX_NETWORK_POLICY_ENFORCED: "false"
  AGAT_A2A_ENABLED: "true"
  AGAT_A2A_PUBLIC_BASE_URL: "http://127.0.0.1:8787"
  AGAT_A2A_OUTBOUND_ENABLED: "true"
  AGAT_A2A_ALLOW_LOOPBACK_OUTBOUND: "false"
  AGAT_A2A_OUTBOUND_TIMEOUT_SECONDS: "15"
  AGAT_A2A_MAX_RESPONSE_BYTES: "1048576"
  AGAT_EDGE_ENABLED: "false"
  AGAT_EDGE_ATTESTATION_MODE: "disabled"
  AGAT_EDGE_ATTESTATION_BROKER_URL: ""
  AGAT_EDGE_ATTESTATION_TIMEOUT_SECONDS: "10"
  AGAT_EDGE_CHALLENGE_TTL_SECONDS: "180"
  AGAT_EDGE_ANDROID_APPLICATION_ID: ""
  AGAT_EDGE_IOS_APPLICATION_ID: ""
  AGAT_EDGE_ALLOW_DEVELOPMENT_ATTESTATION: "false"
  AGAT_EDGE_ANDROID_REQUIRED_VERDICTS: "MEETS_DEVICE_INTEGRITY,PLAY_RECOGNIZED"
  AGAT_EDGE_IOS_REQUIRED_VERDICTS: "APP_ATTEST_VALID"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "agat-coordinator"
  TMPDIR: "/tmp"
