services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AGAT_HOST: 0.0.0.0
      AGAT_PORT: 8787
      AGAT_DB_PATH: /data/agat.db
      AGAT_STATE_STORE_DRIVER: ${AGAT_STATE_STORE_DRIVER:-sqlite}
      AGAT_ARTIFACTS_DIR: /data/artifacts
      AGAT_ADMIN_TOKEN: ${AGAT_ADMIN_TOKEN:?Set AGAT_ADMIN_TOKEN in .env}
      AGAT_ENROLLMENT_TOKEN: ${AGAT_ENROLLMENT_TOKEN:?Set AGAT_ENROLLMENT_TOKEN in .env}
      AGAT_SEED_DEMO: ${AGAT_SEED_DEMO:-false}
      AGAT_SERVE_WEB: "true"
      AGAT_ALLOWED_ORIGINS: ${AGAT_ALLOWED_ORIGINS:-}
      AGAT_OTEL_ENABLED: ${AGAT_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${AGAT_OTEL_COORDINATOR_SERVICE_NAME:-agat-coordinator}
      AGAT_MCP_ENABLED: ${AGAT_MCP_ENABLED:-true}
      AGAT_MCP_REFRESH_SECONDS: ${AGAT_MCP_REFRESH_SECONDS:-30}
      AGAT_MCP_REQUEST_TIMEOUT_SECONDS: ${AGAT_MCP_REQUEST_TIMEOUT_SECONDS:-60}
      AGAT_MCP_MAX_RESPONSE_BYTES: ${AGAT_MCP_MAX_RESPONSE_BYTES:-4194304}
      AGAT_MCP_APPROVAL_TTL_SECONDS: ${AGAT_MCP_APPROVAL_TTL_SECONDS:-600}
      AGAT_A2A_ENABLED: ${AGAT_A2A_ENABLED:-true}
      AGAT_A2A_PUBLIC_BASE_URL: ${AGAT_A2A_PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      AGAT_LOCAL_WORKER_EMBEDDING_MODELS: ${AGAT_LOCAL_WORKER_EMBEDDING_MODELS:-embeddinggemma}
    volumes:
      - agat-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
      search:
        condition: service_healthy
    environment:
      AGAT_COORDINATOR_URL: http://coordinator:8787
      AGAT_ENROLLMENT_TOKEN: ${AGAT_ENROLLMENT_TOKEN:?Set AGAT_ENROLLMENT_TOKEN in .env}
      AGAT_WORKER_NAME: ${AGAT_WORKER_NAME:-docker-worker}
      AGAT_WORKER_MODELS: ${AGAT_WORKER_MODELS:-qwen3:8b}
      AGAT_EMBEDDING_MODELS: ${AGAT_EMBEDDING_MODELS:-embeddinggemma}
      AGAT_MODEL_BASE_URL: ${AGAT_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      AGAT_MODEL_API_KEY: ${AGAT_MODEL_API_KEY:-ollama}
      AGAT_MODEL_DISCOVERY: ${AGAT_MODEL_DISCOVERY:-auto}
      AGAT_MODEL_PROFILES_JSON: ${AGAT_MODEL_PROFILES_JSON:-}
      AGAT_WORKER_CONCURRENCY: ${AGAT_WORKER_CONCURRENCY:-1}
      AGAT_WORKER_GPU: ${AGAT_WORKER_GPU:-}
      AGAT_WORKER_VRAM_MB: ${AGAT_WORKER_VRAM_MB:-0}
      AGAT_WORKER_VRAM_USED_MB: ${AGAT_WORKER_VRAM_USED_MB:-}
      AGAT_WORKER_POWER_WATTS: ${AGAT_WORKER_POWER_WATTS:-}
      AGAT_WORKER_TEMPERATURE_C: ${AGAT_WORKER_TEMPERATURE_C:-}
      AGAT_WORKER_CREDENTIALS: /state/worker.json
      AGAT_WEB_ENABLED: ${AGAT_WEB_ENABLED:-true}
      AGAT_WEB_SEARCH_URL: ${AGAT_WEB_SEARCH_URL:-http://search:8080/search}
      AGAT_WEB_TIMEOUT: ${AGAT_WEB_TIMEOUT:-12}
      AGAT_WEB_FETCH_MAX_BYTES: ${AGAT_WEB_FETCH_MAX_BYTES:-1000000}
      AGAT_WEB_FETCH_MAX_CHARS: ${AGAT_WEB_FETCH_MAX_CHARS:-12000}
      AGAT_WEB_SEARCH_MAX_RESULTS: ${AGAT_WEB_SEARCH_MAX_RESULTS:-6}
      AGAT_WEB_MAX_TOOL_ROUNDS: ${AGAT_WEB_MAX_TOOL_ROUNDS:-6}
      AGAT_MCP_APPROVAL_TIMEOUT_SECONDS: ${AGAT_MCP_APPROVAL_TIMEOUT_SECONDS:-690}
      AGAT_OTEL_ENABLED: ${AGAT_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${AGAT_OTEL_WORKER_SERVICE_NAME:-agat-worker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agat-worker-state:/state

  search:
    profiles: ["worker", "web-search"]
    image: ${AGAT_SEARCH_IMAGE:-docker.io/searxng/searxng:2026.8.12-cdfdaa5a8@sha256:c2dc2d9e6b910653e8628361c23443222490e4cabbb9e02667b7847143db843b}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${AGAT_SEARCH_SECRET:-agat-local-search-only}
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      FORCE_OWNERSHIP: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - agat-search-cache:/var/cache/searxng

volumes:
  agat-data:
  agat-worker-state:
  agat-search-cache:
